<!DOCTYPE html>
<html>
<head>
    <title>YouTube Summarizer Notes</title>
    <link rel="stylesheet" type="text/css" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Main View: List of Notes -->
        <div id="notes-view">
            <div class="header">
                <h1>My Video Notes</h1>
                 <button id="manual-entry-btn" title="Manual Entry" class="header-action-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path d="M14 17H4v2h10v-2zm6-8H4v2h16V9zM4 15h16v-2H4v2zM4 5v2h16V5H4z"></path>
                    </svg>
                </button>
                <button id="settings-btn" title="Settings" class="header-action-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.44,0.17-0.48,0.41L9.2,5.7c-0.59,0.24-1.13,0.57-1.62,0.94l-2.39-0.96c-0.22-0.08-0.47,0-0.59,0.22L2.69,9.22 c-0.11,0.2-0.06,0.47,0.12,0.61l2.03,1.58C4.78,11.69,4.76,12,4.76,12.31c0,0.31,0.02,0.63,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.48-0.41l0.36-2.54c0.59-0.24,1.13-0.57,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59,0.22l1.92-3.32c0.11-0.2,0.06-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"></path>
                    </svg>
                </button>
            </div>
            <div id="notes-container">
                <!-- Notes will be injected here by JS -->
            </div>
            <p id="empty-message" class="hidden">You have no saved notes.</p>
        </div>

        <!-- Settings View -->
        <div id="settings-view" class="hidden">
             <div class="header">
                <button id="settings-back-btn" class="back-btn" title="Back to Notes">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"></path>
                    </svg>
                </button>
                <h1>Settings</h1>
            </div>
            <p class="settings-description">Enter your Google Gemini API Key.</p>
            <div class="input-group">
                <input type="password" id="apiKeyInput" placeholder="Your API Key">
            </div>
            <button id="saveButton">Save</button>
            <span id="statusMessage"></span>
        </div>

        <!-- Manual Summary View -->
        <div id="manual-summary-view" class="hidden">
             <div class="header">
                <button id="manual-back-btn" class="back-btn" title="Back to Notes">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"></path>
                    </svg>
                </button>
                <h1>Summarize Manually</h1>
            </div>
            <div class="input-group">
                <input type="text" id="manualTitleInput" placeholder="Video Title (optional)">
            </div>
            <div class="input-group">
                <input type="text" id="manualUrlInput" placeholder="Paste YouTube Video URL...">
            </div>
            <button id="fetchTranscriptBtn">Fetch & Paste Transcript</button>
            <div class="or-separator">OR</div>
            <div class="input-group">
                <textarea id="manualTranscriptInput" placeholder="Paste transcript here..." rows="8"></textarea>
            </div>
            <button id="generateManualSummaryBtn">Generate Summary</button>
            <span id="manualStatusMessage"></span>
        </div>

    </div>
    <script src="popup.js"></script>
</body>
</html>
